<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111817"><title>Leonida Atlas · GTA VI 个人地图</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="index.html" aria-label="Leonida Atlas 首页"><b class="vi">VI</b><span>LEONIDA <i>ATLAS</i></span></a><nav><button id="explore" aria-pressed="true">探索地图</button><button id="saved" aria-pressed="false">我的收藏 <span id="savedCount">0</span></button></nav><button class="sources" id="sources">资料来源</button></header>
<main><section class="map" aria-label="莱奥奈达互动地图"><div id="viewport" tabindex="0" aria-label="地图选点区域"><div id="world"><img draggable="false" id="base" alt="莱奥奈达地图"><div id="tileLayer" aria-hidden="true"></div><svg id="coverageOverlay" viewBox="0 0 1000 1000" aria-hidden="true"></svg><div id="nearRing" hidden></div><div id="marks"></div><svg id="routeOverlay" viewBox="0 0 1000 1000" aria-hidden="true"><path id="routeHalo"/><path id="routeRoad"/><path id="routeAccess"/></svg><button id="routePin" hidden aria-label="查看导航终点"><span>终点</span></button><button id="playerPin" hidden title="查看我的位置附近" aria-label="查看我的位置附近"><span>我的位置</span></button></div></div>
<div class="map-title"><small><b></b> GTA VI / INTERACTIVE MAP</small><h1>莱奥奈达州</h1><em>State of Leonida</em></div>
<button id="locationTool" class="location-tool">⌖ 我的位置</button><button id="gpsTool" class="gps-tool" aria-pressed="false">GPS 路线</button>
<section id="routePanel" hidden aria-label="GPS 路线"><div class="route-head"><small>GPS · 参考路网</small><button id="clearRoute" aria-label="关闭并清除路线">×</button></div><strong id="routeTitle"></strong><p id="routeSummary" role="status"></p><label class="coverage-control"><input type="checkbox" id="showRoads" checked><span id="coverageLabel">青线 · 已收录道路</span></label><div class="route-actions"><button id="routeStart">放置起点</button><button id="routePick">地图选终点</button><button id="routeFit" hidden>查看全程</button></div></section><div id="placeHint" role="status" hidden>点击地图放置「我的位置」</div>
<div class="compass" aria-hidden="true">N<span>◭</span></div><div class="controls"><button id="plus" aria-label="放大地图">＋</button><button id="minus" aria-label="缩小地图">−</button><button id="reset" aria-label="查看全图">⊙</button></div>
<div class="map-foot"><span class="legend"><span><i></i> 推定点位</span><span><i></i> 地区归档</span></span><button id="extmap">Mapheist 原图 ↗</button></div>
<div id="popup" hidden></div></section>
<aside><div class="cover"><span>FIELD GUIDE</span><h2 id="panelTitle">探索索引</h2></div><section id="nearTools" hidden aria-label="附近推荐设置"><div class="near-heading"><label>范围 <select id="nearRadius"><option value="300">300 米</option><option value="1000" selected>1 公里</option><option value="3000">3 公里</option></select></label><button id="movePin">重新放置</button><button id="removePin">移除</button></div><label class="near-note"><input type="checkbox" id="nearUnknown"> 包含名称待核实的点位</label><small>按社区地图估算直线距离，仅收录有坐标的点位。</small></section><div class="filters"><label class="search"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="搜索地名、店铺、任务或人物" autocomplete="off" aria-label="搜索资料"></label><div id="cats"></div><div class="sourceFilters">
<select id="scope" aria-label="资料范围"><option value="">全部资料</option><option value="atlas">GTADB 社区目录</option><option value="guide">中文攻略与线索</option></select>
<select id="layer" aria-label="证据图层"><option value="">所有图层</option><option value="regions">地区</option><option value="community">社区推定</option><option value="uncertain">待核实</option><option value="unplaced">无坐标</option></select>
<select id="tag" aria-label="原始标签"><option value="">全部标签</option></select></div><label class="photo-filter"><input id="hasPhoto" type="checkbox"> 有游戏截图</label></div>
<div class="listbar"><strong id="listTitle">全部条目</strong><small id="count" aria-live="polite"></small><select id="region" aria-label="地区筛选"></select></div><div id="list"></div></aside></main>
<dialog id="info"><div class="dialog-head"><h2 id="dialogtitle">资料来源</h2><button id="closeInfo" aria-label="关闭">×</button></div><div id="infoBody"></div></dialog>
<script src="map-meta.js"></script><script src="pins.js"></script><script src="data.js"></script><script src="catalog.js"></script><script src="photo-index.js"></script><script src="roads.js"></script><script src="routing.js"></script><script src="app.js"></script></body></html>
